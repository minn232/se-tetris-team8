plugins {
    id 'java'
    id 'application'
    id 'jacoco'
    id 'edu.sc.seis.launch4j' version '3.0.5'
}

repositories {
    mavenCentral()
}

dependencies {
    testImplementation libs.junit.jupiter

    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    implementation libs.guava
    implementation 'javazoom:jlayer:1.0.1'  // MP3 재생용
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

application {
    mainClass = 'screens.Mainmenu'
}

// 리소스 파일 처리
processResources {
    duplicatesStrategy = DuplicatesStrategy.INCLUDE
}

tasks.named('test') {
    useJUnitPlatform()
    finalizedBy jacocoTestReport  // 테스트 후 리포트 자동 생성
}

jacoco {
    toolVersion = '0.8.11'
}

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
}

jacocoTestCoverageVerification {
    dependsOn jacocoTestReport
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value   = 'COVEREDRATIO'
                minimum = 0.70 // 최소 70% 커버리지 요구
            }
        }
    }
}

// JAR 파일 생성 설정
tasks.named('jar') {
    manifest {
        attributes(
            'Main-Class': 'screens.Mainmenu',
            'Class-Path': configurations.runtimeClasspath.files.collect { it.name }.join(' ')
        )
    }
    // 모든 의존성을 포함한 Fat JAR 생성
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

// Launch4j 설정 (exe 파일 생성)
launch4j {
    mainClassName = 'screens.Mainmenu'
    outputDir = 'exe'
    outfile = 'Tetris.exe'
    productName = 'Tetris Game'
    version = '1.0.0'
    textVersion = '1.0.0'
    copyright = '2025'
    bundledJrePath = 'jre'
    jreMinVersion = '17'
    windowTitle = 'Tetris'
    
    // JVM 옵션
    jvmOptions = ['-Xmx512m']
}